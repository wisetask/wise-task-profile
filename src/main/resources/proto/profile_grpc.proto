syntax = "proto3";

package ru.leti.wise.task.profile;

import "profile.proto";
import "google/protobuf/empty.proto";


service ProfileService {
  rpc SignUp(SignUpRequest) returns (SignUpResponse);
  rpc SignIn(SignInRequest) returns (SignInResponse);
  rpc SendResetPasswordEmail(SendResetPasswordEmailRequest) returns (google.protobuf.Empty);
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);
  rpc ChangePassword(ChangePasswordRequest) returns (google.protobuf.Empty);
  rpc GetAllProfiles(GetAllProfilesRequest) returns (GetAllProfilesResponse);
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc GetProfileByEmail(GetProfileByEmailRequest) returns (GetProfileByEmailResponse);
  rpc DeleteProfile(DeleteProfileRequest) returns (google.protobuf.Empty);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  rpc GetProfileStatistic(GetProfileStatisticRequest) returns (GetProfileStatisticResponse);
}

message PaginationRequest {
  int32 page_size = 1;
  int32 page = 2;
}

message ProfileFilter {
  optional string email = 1;
  optional string first_name = 2;
  optional string last_name = 3;
  optional string patronymic = 5;
  repeated string profile_role = 6;
}

message GetAllProfilesRequest{
  PaginationRequest pagination = 1;
  ProfileFilter filter = 2;
}

message GetAllProfilesResponse {
  repeated Profile items = 1;
  PaginationResponse pagination = 2;
}

message PaginationResponse {
  int32 page = 1;
  int32 page_size = 2;
  int64 total_count = 3;
  int32 total_pages = 4;
  bool has_next = 5;
  bool has_previous = 6;
}

message GetProfileRequest {
  string profile_id = 1;
}

message GetProfileResponse {
  Profile profile = 1;
}

message GetProfileByEmailRequest {
  string email = 1;
}

message GetProfileByEmailResponse {
  Profile profile = 1;
}

message DeleteProfileRequest {
  string profile_id = 1;
}

message UpdateProfileRequest {
  Profile profile = 1;
}

message UpdateProfileResponse {
  Profile profile = 1;
}

message GetProfileStatisticRequest {
  string profile_id = 1;
}

message GetProfileStatisticResponse {
  ProfileStatistic profileStatistic = 1;
}

message SignUpRequest {
  Profile profile = 1;
}

message SignUpResponse {
  Profile profile = 1;
}

message SignInRequest {
  string email = 1;
  string password = 2;
}

message SignInResponse {
  Profile profile = 1;
}

message ChangePasswordRequest{
  string profile_id = 1;
  string oldPassword = 2;
  string newPassword = 3;
}

message SendResetPasswordEmailRequest{
  string email = 1;
}

message ResetPasswordRequest{
  string recovery_token = 1;
  string new_password = 2;
}


message ResetPasswordResponse{
  Profile profile = 1;
}